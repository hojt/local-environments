apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-backend
  labels:
    app.kubernetes.io/name: example-backend
    app.kubernetes.io/part-of: local-environment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-backend
        app.kubernetes.io/part-of: local-environment
    spec:
      containers:
        - name: example-backend
          image: localhost/example-backend:0.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
