apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-backend
    spec:
      containers:
        - name: example-backend
          image: localhost:5001/example-backend:0.4.0
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/does-not-exist
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
