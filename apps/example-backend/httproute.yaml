apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-backend
  namespace: default
spec:
  parentRefs:
    - name: local-gateway
  hostnames:
    - example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: example-backend
          port: 8080
