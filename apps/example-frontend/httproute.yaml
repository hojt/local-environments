apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-frontend
  namespace: default
spec:
  parentRefs:
    - name: local-gateway
  hostnames:
    - example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: example-frontend
          port: 8080
