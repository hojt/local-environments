apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-backend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/hojt/local-environments.git
    targetRevision: main
    path: apps/example-backend

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
